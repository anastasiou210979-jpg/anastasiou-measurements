<!doctype html>
<html lang="el"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3a78">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<title>ANASTASIOU Καρτέλα Χονδρικής</title>
<style>
:root{--blue:#0b3a78;--blue2:#1768b4;--bg:#f3f6fa;--line:#d8e1ec;--ok:#15734c;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033}header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:16px;box-shadow:0 2px 10px #0002}header>div,main{max-width:1050px;margin:auto}h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.9;margin-top:3px}main{padding:14px 10px 80px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0b3a7808}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:14px;border:1px solid var(--line);border-radius:13px;background:#f8fbff;text-align:center}.stat strong{display:block;font-size:23px;color:var(--blue)}.stat span{font-size:12px;color:#667085}label{display:grid;gap:5px;font-size:13px;font-weight:750;color:#344054}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:#172033}button{border:0;border-radius:10px;padding:10px 12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.light{background:#eaf1f8;color:var(--blue)}.danger{background:#feecea;color:var(--bad)}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.note{background:#eef6ff;border-left:4px solid var(--blue);padding:10px;border-radius:9px;font-size:13px}.hidden{display:none!important}.customers,.history{display:grid;gap:8px}.customer,.movement{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;justify-content:space-between;align-items:center;gap:10px}.balance{font-size:20px;font-weight:850;color:var(--bad)}.zero{color:var(--ok)}.charge{color:var(--bad);font-weight:850}.payment{color:var(--ok);font-weight:850}.muted{color:#667085;font-size:13px}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#edf3f8;font-size:12px}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:460px){.grid,.stats{grid-template-columns:1fr}.customer,.movement{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div><h1>ANASTASIOU Καρτέλα Χονδρικής</h1><div class="sub">Υπόλοιπα και κινήσεις ανά πελάτη χονδρικής</div></div></header>
<main>
<section id="loginCard" class="card"><h2>Σύνδεση</h2><p class="note">Συνδέσου με τον ίδιο λογαριασμό που χρησιμοποιείς στις Μετρήσεις.</p><div class="grid"><label>Email<input id="loginEmail" type="email"></label><label>Κωδικός<input id="loginPassword" type="password"></label></div><div class="tools"><button id="loginBtn">Σύνδεση</button><button id="offlineBtn" class="light">Χρήση χωρίς σύνδεση</button></div><div id="loginMessage" class="muted"></div></section>
<div id="app" class="hidden">
<section class="card"><h2>Σύνοψη</h2><div class="stats"><div class="stat"><strong id="chargesTotal">0,00 €</strong><span>Συνολικές χρεώσεις</span></div><div class="stat"><strong id="paymentsTotal">0,00 €</strong><span>Συνολικές πληρωμές</span></div><div class="stat"><strong id="balanceTotal">0,00 €</strong><span>Συνολικό υπόλοιπο</span></div></div></section>
<section class="card"><h2>Νέα κίνηση</h2><input id="editId" type="hidden"><div class="grid"><label>Ημερομηνία<input id="date" type="date"></label><label>Πελάτης<input id="customer" list="customerNames" placeholder="Όνομα πελάτη"><datalist id="customerNames"></datalist></label><label>Είδος κίνησης<select id="type"><option value="charge">Χρέωση</option><option value="payment">Πληρωμή</option></select></label><label>Ποσό<input id="amount" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></label><label>Παραστατικό / Αριθμός<input id="documentNo" placeholder="Π.χ. ΤΙΜ-123"></label><label>Τρόπος πληρωμής<select id="method"><option value="">—</option><option>Μετρητά</option><option>Τράπεζα</option><option>Κάρτα</option><option>Επιταγή</option></select></label></div><label style="margin-top:9px">Παρατήρηση<textarea id="notes" rows="2" placeholder="Προαιρετικά"></textarea></label><div class="tools"><button id="saveBtn">💾 Αποθήκευση</button><button id="clearBtn" class="light">Καθαρισμός</button></div><div id="status" class="muted"></div></section>
<section class="card"><h2>Πελάτες χονδρικής</h2><label>Αναζήτηση πελάτη<input id="customerSearch" placeholder="Γράψε όνομα πελάτη"></label><div id="customers" class="customers" style="margin-top:12px"></div></section>
<section class="card"><h2 id="historyTitle">Όλες οι κινήσεις</h2><div class="grid"><label>Αναζήτηση<input id="search" placeholder="Πελάτης, παραστατικό ή παρατήρηση"></label><label>Μήνας<input id="monthFilter" type="month"></label></div><div class="tools"><button id="showAllBtn" class="light">Εμφάνιση όλων</button></div><div id="history" class="history" style="margin-top:12px"></div></section>
</div></main>
<script type="module">
import {firebaseConfig} from "../firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const KEY='ANASTASIOU_XONDRIKI_V1',$=s=>document.querySelector(s),euro=n=>new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(Number(n)||0),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let entries=readLocal(),auth=null,db=null,user=null,offline=false,selectedCustomer='';
function readLocal(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function writeLocal(){localStorage.setItem(KEY,JSON.stringify(entries))}function id(){return crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`}function today(){return new Date().toISOString().slice(0,10)}
function clearForm(){$('#editId').value='';$('#date').value=today();$('#customer').value='';$('#type').value='charge';$('#amount').value='';$('#documentNo').value='';$('#method').value='';$('#notes').value='';$('#status').textContent=''}
function totals(list){return list.reduce((a,x)=>{const n=Number(x.amount)||0;x.type==='payment'?a.payments+=n:a.charges+=n;return a},{charges:0,payments:0})}
function customerMap(){const map=new Map;entries.forEach(x=>{const name=(x.customer||'Χωρίς όνομα').trim(),v=map.get(name)||{name,charges:0,payments:0,count:0};v[x.type==='payment'?'payments':'charges']+=Number(x.amount)||0;v.count++;map.set(name,v)});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'el'))}
function render(){const all=totals(entries);$('#chargesTotal').textContent=euro(all.charges);$('#paymentsTotal').textContent=euro(all.payments);$('#balanceTotal').textContent=euro(all.charges-all.payments);const customers=customerMap(),cq=$('#customerSearch').value.trim().toLowerCase();$('#customerNames').innerHTML=customers.map(x=>`<option value="${esc(x.name)}">`).join('');const shownCustomers=customers.filter(x=>!cq||x.name.toLowerCase().includes(cq));$('#customers').innerHTML=shownCustomers.length?shownCustomers.map(x=>{const bal=x.charges-x.payments;return `<div class="customer"><div><strong>${esc(x.name)}</strong><div class="muted">Χρεώσεις ${euro(x.charges)} • Πληρωμές ${euro(x.payments)} • ${x.count} κινήσεις</div></div><div><div class="balance ${bal<=0?'zero':''}">${euro(bal)}</div><button class="light view" data-name="${esc(x.name)}">Καρτέλα</button></div></div>`}).join(''):'<p class="note">Δεν υπάρχουν ακόμη πελάτες.</p>';document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{selectedCustomer=b.dataset.name;$('#historyTitle').textContent=`Καρτέλα: ${selectedCustomer}`;renderHistory();location.hash='history'});renderHistory()}
function renderHistory(){const q=$('#search').value.trim().toLowerCase(),mf=$('#monthFilter').value;const shown=entries.filter(x=>(!selectedCustomer||x.customer===selectedCustomer)&&(!q||`${x.customer} ${x.documentNo} ${x.notes}`.toLowerCase().includes(q))&&(!mf||x.date?.startsWith(mf))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));$('#history').innerHTML=shown.length?shown.map(x=>`<div class="movement"><div><div><strong>${esc(x.customer||'Χωρίς πελάτη')}</strong> • ${esc(x.date)}</div><div class="muted"><span class="pill">${x.type==='payment'?'Πληρωμή':'Χρέωση'}</span>${x.documentNo?' • '+esc(x.documentNo):''}${x.method?' • '+esc(x.method):''}${x.notes?' • '+esc(x.notes):''}</div></div><div><div class="${x.type==='payment'?'payment':'charge'}">${x.type==='payment'?'-':'+'}${euro(x.amount)}</div><div class="tools"><button class="light edit" data-id="${x.id}">Διόρθωση</button><button class="danger del" data-id="${x.id}">Διαγραφή</button></div></div></div>`).join(''):'<p class="note">Δεν υπάρχουν κινήσεις.</p>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editEntry(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>removeEntry(b.dataset.id))}
function editEntry(entryId){const x=entries.find(i=>i.id===entryId);if(!x)return;$('#editId').value=x.id;$('#date').value=x.date;$('#customer').value=x.customer;$('#type').value=x.type;$('#amount').value=x.amount;$('#documentNo').value=x.documentNo||'';$('#method').value=x.method||'';$('#notes').value=x.notes||'';scrollTo({top:220,behavior:'smooth'})}
async function removeEntry(entryId){if(!confirm('Να διαγραφεί αυτή η κίνηση;'))return;entries=entries.filter(x=>x.id!==entryId);writeLocal();render();if(user&&!offline)await deleteDoc(doc(db,'projects',`_xondriki_${entryId}`))}
$('#saveBtn').onclick=async()=>{const amount=Number($('#amount').value),customer=$('#customer').value.trim();if(!$('#date').value||!customer||!amount){$('#status').textContent='Συμπλήρωσε ημερομηνία, πελάτη και ποσό.';return}const oldId=$('#editId').value||id(),entry={id:oldId,date:$('#date').value,customer,type:$('#type').value,amount,documentNo:$('#documentNo').value.trim(),method:$('#method').value,notes:$('#notes').value.trim(),createdAt:entries.find(x=>x.id===oldId)?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:user?.email||'offline'};const at=entries.findIndex(x=>x.id===oldId);at>=0?entries[at]=entry:entries.push(entry);writeLocal();if(user&&!offline)await setDoc(doc(db,'projects',`_xondriki_${oldId}`),{...entry,typeRecord:'xondriki',serverUpdatedAt:serverTimestamp()},{merge:true});clearForm();render();$('#status').textContent='Η κίνηση αποθηκεύτηκε.'};
$('#clearBtn').onclick=clearForm;$('#search').oninput=renderHistory;$('#monthFilter').onchange=renderHistory;$('#customerSearch').oninput=render;$('#showAllBtn').onclick=()=>{selectedCustomer='';$('#historyTitle').textContent='Όλες οι κινήσεις';renderHistory()};$('#offlineBtn').onclick=()=>{offline=true;showApp()};function showApp(){$('#loginCard').classList.add('hidden');$('#app').classList.remove('hidden');clearForm();render()}
try{const firebaseApp=initializeApp(firebaseConfig);auth=getAuth(firebaseApp);db=getFirestore(firebaseApp);$('#loginBtn').onclick=async()=>{try{$('#loginMessage').textContent='Σύνδεση…';await signInWithEmailAndPassword(auth,$('#loginEmail').value.trim(),$('#loginPassword').value);$('#loginMessage').textContent=''}catch{$('#loginMessage').textContent='Λάθος email ή κωδικός.'}};onAuthStateChanged(auth,current=>{user=current;if(!current)return;showApp();onSnapshot(collection(db,'projects'),snapshot=>{const cloud=snapshot.docs.filter(x=>x.id.startsWith('_xondriki_')).map(x=>x.data());const merged=new Map(entries.map(x=>[x.id,x]));cloud.forEach(x=>merged.set(x.id,x));entries=[...merged.values()];writeLocal();render()})})}catch{$('#loginMessage').textContent='Δεν φορτώθηκε η σύνδεση. Χρησιμοποίησε την τοπική λειτουργία.'}
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script>
</body></html>
