<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANASTASIOU Μετρήσεις">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>ANASTASIOU Μετρήσεις</title>
  <style>
    :root{
      --bg:#f4f7fb; --card:#fff; --ink:#172033; --muted:#667085;
      --primary:#1f4f8f; --primary2:#143b70;
      --offer:#f5b942; --final:#3b82f6; --done:#22a06b; --danger:#c93c3c;
      --border:#dbe2ea; --shadow:0 8px 24px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    button,input,select,textarea{font:inherit}
    .app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}
    header{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 24px 24px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:14px;padding:5px}
    h1{font-size:22px;margin:0}.subtitle{margin:4px 0 0;opacity:.86;font-size:14px}
    main{padding:18px}
    .view{display:none}.view.active{display:block}
    .section-title{font-size:20px;margin:4px 0 14px}
    .dashboard{display:grid;gap:14px}
    .counter-card{border:0;width:100%;text-align:left;background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between}
    .counter-card .left{display:flex;align-items:center;gap:14px}
    .counter-card .icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:27px}
    .counter-card.offer .icon{background:#fff4d4}.counter-card.final .icon{background:#e8f1ff}
    .counter-card strong{display:block;font-size:18px}.counter-card span{color:var(--muted);font-size:14px}
    .count{font-size:34px;font-weight:800}.offer .count{color:#a96d00}.final .count{color:#245fc7}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    .btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;cursor:pointer}
    .btn.primary{background:var(--primary);color:white}.btn.secondary{background:#e9eef5;color:var(--ink)}
    .btn.success{background:var(--done);color:white}.btn.danger{background:#fff0f0;color:var(--danger)}
    .btn.full{width:100%}.btn.small{padding:9px 11px;font-size:14px}
    .list{display:grid;gap:12px}
    .project{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
    .project-top{display:flex;justify-content:space-between;gap:12px}.project h3{margin:0 0 5px;font-size:18px}
    .meta{color:var(--muted);font-size:14px;line-height:1.5}
    .badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap}
    .badge.offer{background:#fff4d4;color:#835500}.badge.final{background:#e8f1ff;color:#174f9f}.badge.done{background:#e5f7ef;color:#13744a}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .empty{background:white;border:1px dashed var(--border);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
    .form-card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
    label{display:block;font-weight:700;margin:14px 0 6px}
    input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
    textarea{min-height:95px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .back{border:0;background:#e9eef5;border-radius:12px;padding:10px 13px;margin-bottom:12px;font-weight:700}
    .search{margin-bottom:14px}
    nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10}
    nav button{border:0;background:transparent;padding:8px 4px;color:var(--muted);font-size:12px;font-weight:700}
    nav button.active{color:var(--primary)}nav .nav-icon{display:block;font-size:23px;margin-bottom:2px}
    .note{margin-top:14px;padding:12px;border-radius:12px;background:#eef5ff;color:#244c78;font-size:14px}
    @media(max-width:520px){.row{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img src="logo.png" alt="ANASTASIOU O.E." onerror="this.style.display='none'">
      <div><h1>ANASTASIOU Μετρήσεις</h1><p class="subtitle">Εκκρεμότητες μετρήσεων</p></div>
    </div>
  </header>

  <main>
    <section id="homeView" class="view active">
      <h2 class="section-title">Μετρήσεις</h2>
      <div class="dashboard">
        <button class="counter-card offer" onclick="openList('offer')">
          <div class="left"><div class="icon">📋</div><div><strong>Έργα για μέτρηση προσφοράς</strong><span>Πατήστε για να δείτε τη λίστα</span></div></div>
          <div id="offerCount" class="count">0</div>
        </button>
        <button class="counter-card final" onclick="openList('final')">
          <div class="left"><div class="icon">📐</div><div><strong>Έργα για τελική μέτρηση</strong><span>Εγκεκριμένες προσφορές</span></div></div>
          <div id="finalCount" class="count">0</div>
        </button>
      </div>
      <div class="quick">
        <button class="btn primary" onclick="openNewProject()">＋ Νέο έργο</button>
        <button class="btn secondary" onclick="openAllProjects()">Όλα τα έργα</button>
      </div>
      <div class="note">Κάθε έργο μπορεί να το αναλάβει είτε ο Γιώργος είτε ο αδελφός του.</div>
    </section>

    <section id="listView" class="view">
      <button class="back" onclick="goHome()">← Πίσω</button>
      <h2 id="listTitle" class="section-title"></h2>
      <input id="searchInput" class="search" type="search" placeholder="Αναζήτηση πελάτη, περιοχής ή τηλεφώνου…" oninput="renderCurrentList()">
      <div id="projectList" class="list"></div>
    </section>

    <section id="formView" class="view">
      <button class="back" onclick="goHome()">← Πίσω</button>
      <h2 id="formTitle" class="section-title">Νέο έργο</h2>
      <form id="projectForm" class="form-card">
        <input type="hidden" id="projectId">
        <label for="customer">Πελάτης *</label>
        <input id="customer" required autocomplete="name">
        <div class="row">
          <div><label for="phone">Τηλέφωνο</label><input id="phone" type="tel" autocomplete="tel"></div>
          <div><label for="area">Περιοχή</label><input id="area"></div>
        </div>
        <label for="address">Διεύθυνση</label>
        <input id="address" autocomplete="street-address">
        <div class="row">
          <div><label for="status">Κατηγορία μέτρησης</label>
            <select id="status">
              <option value="offer">Μέτρηση προσφοράς</option>
              <option value="final">Τελική μέτρηση παραγωγής</option>
              <option value="done">Ολοκληρωμένη μέτρηση</option>
            </select>
          </div>
          <div><label for="assigned">Ανάθεση</label>
            <select id="assigned">
              <option value="">Δεν έχει ανατεθεί</option>
              <option value="Γιώργος">Γιώργος</option>
              <option value="Αδελφός">Αδελφός</option>
            </select>
          </div>
        </div>
        <label for="date">Ημερομηνία μέτρησης</label>
        <input id="date" type="date">
        <label for="notes">Παρατηρήσεις</label>
        <textarea id="notes"></textarea>
        <button class="btn primary full" type="submit" style="margin-top:18px">Αποθήκευση έργου</button>
      </form>
    </section>
  </main>

  <nav>
    <button id="navHome" class="active" onclick="goHome()"><span class="nav-icon">🏠</span>Αρχική</button>
    <button id="navNew" onclick="openNewProject()"><span class="nav-icon">➕</span>Νέο έργο</button>
    <button id="navAll" onclick="openAllProjects()"><span class="nav-icon">📁</span>Έργα</button>
  </nav>
</div>

<script>
const STORAGE_KEY='anastasiou_measurements_v2_projects';
let projects=loadProjects();
let currentFilter='all';

function loadProjects(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}
  catch(e){return []}
}
function saveProjects(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
  updateCounts();
}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function statusLabel(s){return s==='offer'?'Μέτρηση προσφοράς':s==='final'?'Τελική μέτρηση':'Ολοκληρωμένη'}
function statusClass(s){return s==='offer'?'offer':s==='final'?'final':'done'}
function updateCounts(){
  document.getElementById('offerCount').textContent=projects.filter(p=>p.status==='offer').length;
  document.getElementById('finalCount').textContent=projects.filter(p=>p.status==='final').length;
}
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
}
function goHome(){
  showView('homeView');document.getElementById('navHome').classList.add('active');updateCounts();
}
function openNewProject(){
  showView('formView');document.getElementById('navNew').classList.add('active');
  document.getElementById('formTitle').textContent='Νέο έργο';
  document.getElementById('projectForm').reset();
  document.getElementById('projectId').value='';
  document.getElementById('date').value=new Date().toISOString().slice(0,10);
}
function openList(filter){
  currentFilter=filter;showView('listView');
  document.getElementById('navAll').classList.add('active');
  document.getElementById('searchInput').value='';
  document.getElementById('listTitle').textContent=filter==='offer'?'Έργα για μέτρηση προσφοράς':'Έργα για τελική μέτρηση';
  renderCurrentList();
}
function openAllProjects(){
  currentFilter='all';showView('listView');document.getElementById('navAll').classList.add('active');
  document.getElementById('searchInput').value='';
  document.getElementById('listTitle').textContent='Όλα τα έργα';
  renderCurrentList();
}
function renderCurrentList(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  let data=projects.filter(p=>currentFilter==='all'||p.status===currentFilter);
  if(q)data=data.filter(p=>[p.customer,p.phone,p.area,p.address,p.assigned].join(' ').toLowerCase().includes(q));
  data.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  const box=document.getElementById('projectList');
  if(!data.length){box.innerHTML='<div class="empty">Δεν υπάρχουν έργα σε αυτή την κατηγορία.</div>';return}
  box.innerHTML=data.map(p=>`
    <article class="project">
      <div class="project-top">
        <div><h3>${esc(p.customer)}</h3><div class="meta">${esc(p.area||p.address||'Χωρίς περιοχή')} ${p.phone?'• '+esc(p.phone):''}</div></div>
        <span class="badge ${statusClass(p.status)}">${statusLabel(p.status)}</span>
      </div>
      <div class="meta" style="margin-top:8px">
        ${p.assigned?'Ανάθεση: <strong>'+esc(p.assigned)+'</strong><br>':''}
        ${p.date?'Ημερομηνία: '+new Date(p.date+'T00:00:00').toLocaleDateString('el-GR')+'<br>':''}
        ${p.notes?esc(p.notes):''}
      </div>
      <div class="actions">
        <button class="btn secondary small" onclick="editProject('${p.id}')">Επεξεργασία</button>
        ${p.status==='offer'?`<button class="btn success small" onclick="moveToFinal('${p.id}')">Έτοιμο για τελική μέτρηση</button>`:''}
        ${p.status==='final'?`<button class="btn success small" onclick="completeProject('${p.id}')">Ολοκλήρωση μέτρησης</button>`:''}
        <button class="btn danger small" onclick="deleteProject('${p.id}')">Διαγραφή</button>
      </div>
    </article>`).join('');
}
function editProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  showView('formView');document.getElementById('navAll').classList.add('active');
  document.getElementById('formTitle').textContent='Επεξεργασία έργου';
  ['projectId','customer','phone','area','address','status','assigned','date','notes'].forEach(k=>{
    const el=document.getElementById(k); el.value=k==='projectId'?p.id:(p[k]||'');
  });
}
function moveToFinal(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  p.status='final';p.updatedAt=new Date().toISOString();saveProjects();renderCurrentList();
  alert('Το έργο μεταφέρθηκε στις τελικές μετρήσεις.');
}
function completeProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  p.status='done';p.updatedAt=new Date().toISOString();saveProjects();renderCurrentList();
}
function deleteProject(id){
  if(!confirm('Να διαγραφεί αυτό το έργο;'))return;
  projects=projects.filter(x=>x.id!==id);saveProjects();renderCurrentList();
}
document.getElementById('projectForm').addEventListener('submit',e=>{
  e.preventDefault();
  const id=document.getElementById('projectId').value;
  const data={
    id:id||('prj_'+Date.now()),
    customer:document.getElementById('customer').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    area:document.getElementById('area').value.trim(),
    address:document.getElementById('address').value.trim(),
    status:document.getElementById('status').value,
    assigned:document.getElementById('assigned').value,
    date:document.getElementById('date').value,
    notes:document.getElementById('notes').value.trim(),
    updatedAt:new Date().toISOString()
  };
  if(id){
    const i=projects.findIndex(x=>x.id===id);
    data.createdAt=projects[i]?.createdAt||data.updatedAt;
    projects[i]=data;
  }else{
    data.createdAt=data.updatedAt;projects.push(data);
  }
  saveProjects();goHome();alert('Το έργο αποθηκεύτηκε.');
});
updateCounts();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
