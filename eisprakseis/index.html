<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3a78"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
  <title>ANASTASIOU Εισπράξεις</title>
  <style>
    :root{--blue:#0b3a78;--blue2:#1768b4;--bg:#f3f6fa;--line:#d8e1ec;--ok:#15734c;--bad:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033}header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:16px;box-shadow:0 2px 10px #0002}header>div,main{max-width:1000px;margin:auto}h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.9;margin-top:3px}main{padding:14px 10px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0b3a7808}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:14px;border:1px solid var(--line);border-radius:13px;background:#f8fbff;text-align:center}.stat strong{display:block;font-size:23px;color:var(--blue)}.stat span{font-size:12px;color:#667085}label{display:grid;gap:5px;font-size:13px;font-weight:750;color:#344054}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:#172033}button{border:0;border-radius:10px;padding:10px 12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.light{background:#eaf1f8;color:var(--blue)}.danger{background:#feecea;color:var(--bad)}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.note{background:#eef6ff;border-left:4px solid var(--blue);padding:10px;border-radius:9px;font-size:13px}.hidden{display:none!important}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;justify-content:space-between;align-items:center;gap:10px}.amount{font-size:20px;font-weight:850;color:var(--ok)}.muted{color:#667085;font-size:13px}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:460px){.grid,.stats{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><div><h1>ANASTASIOU Εισπράξεις</h1><div class="sub">Απλή καταγραφή όλων των χρημάτων που εισπράττονται</div></div></header>
<main>
  <section id="loginCard" class="card"><h2>Σύνδεση</h2><p class="note">Συνδέσου με τον ίδιο λογαριασμό που χρησιμοποιείς στις Μετρήσεις.</p><div class="grid"><label>Email<input id="loginEmail" type="email"></label><label>Κωδικός<input id="loginPassword" type="password"></label></div><div class="tools"><button id="loginBtn">Σύνδεση</button><button id="offlineBtn" class="light">Χρήση χωρίς σύνδεση</button></div><div id="loginMessage" class="muted"></div></section>
  <div id="app" class="hidden">
    <section class="card"><h2>Σύνοψη</h2><div class="stats"><div class="stat"><strong id="todayTotal">0,00 €</strong><span>Σήμερα</span></div><div class="stat"><strong id="weekTotal">0,00 €</strong><span>Αυτή την εβδομάδα</span></div><div class="stat"><strong id="monthTotal">0,00 €</strong><span>Αυτόν τον μήνα</span></div><div class="stat"><strong id="yearTotal">0,00 €</strong><span>Αυτό το έτος</span></div></div></section>
    <section class="card"><h2>＋ Νέα είσπραξη</h2><input id="editId" type="hidden"><div class="grid"><label>Ημερομηνία<input id="date" type="date"></label><label>Πελάτης<input id="customer" placeholder="Όνομα πελάτη"></label><label>Ποσό<input id="amount" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></label><label>Τρόπος πληρωμής<select id="method"><option>Μετρητά</option><option>Τράπεζα</option><option>Κάρτα</option><option>Επιταγή</option></select></label></div><label style="margin-top:9px">Παρατήρηση<textarea id="notes" rows="2" placeholder="Προαιρετικά"></textarea></label><div class="tools"><button id="saveBtn">💾 Αποθήκευση</button><button id="clearBtn" class="light">Καθαρισμός</button></div><div id="status" class="muted"></div></section>
    <section class="card"><h2>Όλες οι εισπράξεις</h2><div class="grid"><label>Αναζήτηση<input id="search" placeholder="Πελάτης ή παρατήρηση"></label><label>Μήνας<input id="monthFilter" type="month"></label></div><div id="list" class="list" style="margin-top:12px"></div></section>
  </div>
</main>
<script type="module">
import {firebaseConfig} from "../firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const KEY='ANASTASIOU_EISPRAKSEIS_V1',$=s=>document.querySelector(s),euro=n=>new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(Number(n)||0),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let entries=readLocal(),auth=null,db=null,user=null,offline=false;
function readLocal(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function writeLocal(){localStorage.setItem(KEY,JSON.stringify(entries))}function id(){return crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`}
function today(){return new Date().toISOString().slice(0,10)}function monday(){const d=new Date(),x=(d.getDay()+6)%7;d.setDate(d.getDate()-x);return d.toISOString().slice(0,10)}
function clearForm(){$('#editId').value='';$('#date').value=today();$('#customer').value='';$('#amount').value='';$('#method').value='Μετρητά';$('#notes').value='';$('#status').textContent=''}
function render(){const now=today(),week=monday(),month=now.slice(0,7),year=now.slice(0,4),sum=items=>items.reduce((n,x)=>n+(Number(x.amount)||0),0);$('#todayTotal').textContent=euro(sum(entries.filter(x=>x.date===now)));$('#weekTotal').textContent=euro(sum(entries.filter(x=>x.date>=week&&x.date<=now)));$('#monthTotal').textContent=euro(sum(entries.filter(x=>x.date?.startsWith(month))));$('#yearTotal').textContent=euro(sum(entries.filter(x=>x.date?.startsWith(year))));const q=$('#search').value.trim().toLowerCase(),mf=$('#monthFilter').value;const shown=entries.filter(x=>(!q||`${x.customer} ${x.notes}`.toLowerCase().includes(q))&&(!mf||x.date?.startsWith(mf))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));$('#list').innerHTML=shown.length?shown.map(x=>`<div class="item"><div><div><strong>${esc(x.customer||'Χωρίς πελάτη')}</strong> • ${esc(x.date)}</div><div class="muted">${esc(x.method)}${x.notes?' • '+esc(x.notes):''}</div></div><div><div class="amount">${euro(x.amount)}</div><div class="tools"><button class="light edit" data-id="${x.id}">Διόρθωση</button><button class="danger del" data-id="${x.id}">Διαγραφή</button></div></div></div>`).join(''):'<p class="note">Δεν υπάρχουν καταχωρισμένες εισπράξεις.</p>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editEntry(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>removeEntry(b.dataset.id))}
function editEntry(entryId){const x=entries.find(i=>i.id===entryId);if(!x)return;$('#editId').value=x.id;$('#date').value=x.date;$('#customer').value=x.customer;$('#amount').value=x.amount;$('#method').value=x.method;$('#notes').value=x.notes||'';scrollTo({top:250,behavior:'smooth'})}
async function removeEntry(entryId){if(!confirm('Να διαγραφεί αυτή η είσπραξη;'))return;entries=entries.filter(x=>x.id!==entryId);writeLocal();render();if(user&&!offline)await deleteDoc(doc(db,'projects',`_eispraksi_${entryId}`))}
$('#saveBtn').onclick=async()=>{const amount=Number($('#amount').value);if(!$('#date').value||!amount){$('#status').textContent='Συμπλήρωσε ημερομηνία και ποσό.';return}const oldId=$('#editId').value||id(),entry={id:oldId,date:$('#date').value,customer:$('#customer').value.trim(),amount,method:$('#method').value,notes:$('#notes').value.trim(),createdAt:entries.find(x=>x.id===oldId)?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:user?.email||'offline'};const at=entries.findIndex(x=>x.id===oldId);if(at>=0)entries[at]=entry;else entries.push(entry);writeLocal();if(user&&!offline)await setDoc(doc(db,'projects',`_eispraksi_${oldId}`),{...entry,type:'eispraksi',serverUpdatedAt:serverTimestamp()},{merge:true});clearForm();render();$('#status').textContent='Η είσπραξη αποθηκεύτηκε.'};
$('#clearBtn').onclick=clearForm;$('#search').oninput=render;$('#monthFilter').onchange=render;$('#offlineBtn').onclick=()=>{offline=true;showApp()};function showApp(){$('#loginCard').classList.add('hidden');$('#app').classList.remove('hidden');clearForm();render()}
try{const firebaseApp=initializeApp(firebaseConfig);auth=getAuth(firebaseApp);db=getFirestore(firebaseApp);$('#loginBtn').onclick=async()=>{try{$('#loginMessage').textContent='Σύνδεση…';await signInWithEmailAndPassword(auth,$('#loginEmail').value.trim(),$('#loginPassword').value);$('#loginMessage').textContent=''}catch{$('#loginMessage').textContent='Λάθος email ή κωδικός.'}};onAuthStateChanged(auth,current=>{user=current;if(!current)return;showApp();onSnapshot(collection(db,'projects'),snapshot=>{const cloud=snapshot.docs.filter(x=>x.id.startsWith('_eispraksi_')).map(x=>x.data());const merged=new Map(entries.map(x=>[x.id,x]));cloud.forEach(x=>merged.set(x.id,x));entries=[...merged.values()];writeLocal();render()})})}catch{$('#loginMessage').textContent='Δεν φορτώθηκε η σύνδεση. Χρησιμοποίησε την τοπική λειτουργία.'}
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script>
</body></html>
